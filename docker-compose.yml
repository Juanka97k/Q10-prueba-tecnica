services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow_user} -d ${POSTGRES_DB:-orderflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker de Mensajería RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: orderflow-mq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # Puerto de mensajería AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Dashboard Web de RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
