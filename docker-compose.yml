services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow_user} -d ${POSTGRES_DB:-orderflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - orderflow-net

  # 2. Broker de Mensajería RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: orderflow-mq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # Puerto de mensajería AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Dashboard Web de RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - orderflow-net

  # 3. Web API .NET (HTTP REST + SignalR Hub)
  api:
    build:
      context: .
      dockerfile: src/OrderFlow.Api/Dockerfile
    container_name: orderflow-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderflow_db};Username=${POSTGRES_USER:-orderflow_user};Password=${POSTGRES_PASSWORD:-orderflow_password}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
    ports:
      - "5167:80"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderflow-net

  # 4. Inventory Worker (.NET Background Service)
  worker:
    build:
      context: .
      dockerfile: src/OrderFlow.InventoryWorker/Dockerfile
    container_name: orderflow-worker
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-orderflow_db};Username=${POSTGRES_USER:-orderflow_user};Password=${POSTGRES_PASSWORD:-orderflow_password}"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Dependencia opcional con la API (descomentar si se requiere sincronización estricta de arranque):
      # api:
      #   condition: service_started
    networks:
      - orderflow-net

  # 5. Frontend Angular (Nginx Runner)
  frontend:
    build:
      context: ./src/OrderFlow.App
      dockerfile: Dockerfile
    container_name: orderflow-app
    ports:
      - "4200:80"
    depends_on:
      - api
      # Alternativa con comprobación explícita de salud (descomentar si se requiere):
      # api:
      #   condition: service_started
    networks:
      - orderflow-net

volumes:
  postgres_data:

networks:
  orderflow-net:
    driver: bridge
