<div class="container">
  <!-- Header principal -->
  <header class="header">
    <div class="brand">
      <div class="logo">📦</div>
      <div>
        <h1>OrderFlow Dashboard</h1>
        <p class="subtitle">Monitoreo de Pedidos e Inventario Asíncrono en Tiempo Real</p>
      </div>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      <span class="status-text">Sistema en Línea</span>
    </div>
  </header>

  <!-- Grid Principal con Formulario y Tabla de Pedidos -->
  <div class="grid">
    <app-order-form (orderCreated)="onOrderCreated($event)"></app-order-form>
    <app-order-list [orders]="orders()"></app-order-list>
  </div>
</div>
